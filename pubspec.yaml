name: synheart_core
description: Flutter SDK for the Human State Interface (HSI) 1.3 — unified collection of wearable, behavior, and phone signals with consent-gated cloud upload.
version: 0.15.0
homepage: https://github.com/synheart-ai/synheart-core-flutter
repository: https://github.com/synheart-ai/synheart-core-flutter
issue_tracker: https://github.com/synheart-ai/synheart-core-flutter/issues
documentation: https://docs.synheart.ai/synheart-core
topics:
  - health
  - wearable
  - biosignals
  - hsi
  - flutter
license: Apache-2.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Synheart interpretation SDKs (pub.dev)
  # Accept the 0.5.x line as well: 0.5.0 is an additive, backward-compatible
  # release (optional per-request auth-header signer), so the re-exported
  # workout/provider surface is unchanged. Kept below 0.6.0 to guard against a
  # future breaking major.
  synheart_wear: ">=0.4.0 <0.6.0"
  synheart_session: ^0.3.0
  synheart_behavior: ^0.4.0
  synheart_auth: ^0.1.7

  # FFI for the Synheart Runtime native library
  ffi: ^2.1.0

  # Syni client — Flutter SDK for on-device LLM inference (pub.dev).
  syni: ^0.3.2

  # Core dependencies
  rxdart: ^0.28.0
  collection: ^1.18.0

  # Cryptography for HMAC verification and artifact SHA-256
  crypto: ^3.0.3

  # AEAD encryption (XChaCha20-Poly1305) for artifact encryption-at-rest
  cryptography: ^2.7.0

  # SQLite storage for artifact catalog
  sqflite: ^2.3.0
  path: ^1.9.0
  # Used by `AppleHealthRuntimeSink.defaultDbPath()` to resolve a
  # durable on-device path for the backfill dedup index. Without it,
  # the backfill DB lands in `Directory.systemTemp` and gets cleaned
  # up by iOS, breaking idempotency across app launches.
  path_provider: ^2.1.5

  # Secure storage for consent and sensitive data
  flutter_secure_storage: ^9.0.0

  # Optional: for cloud sync
  http: ^1.1.0
  connectivity_plus: ^6.0.5

  # State management for example app
  provider: ^6.1.1

  # Preferences storage
  shared_preferences: ^2.2.2

  # UUID generation for consent tokens
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  plugin:
    platforms:
      ios:
        pluginClass: SynheartCorePlugin
      android:
        ffiPlugin: true
        package: ai.synheart.core_runtime
